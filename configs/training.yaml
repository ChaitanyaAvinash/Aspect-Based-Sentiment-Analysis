# Training configuration (HuggingFace Trainer for Track B).
seed: 42

transformer:
  output_dir: artifacts/checkpoints
  num_train_epochs: 5
  per_device_train_batch_size: 16      # 16-32 fits RTX 4070 @ max_len=128
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1       # raise if switching to a -large encoder
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  bf16: true                           # Ada Lovelace (RTX 4070) supports bf16 natively
  fp16: false
  dataloader_num_workers: 2            # keep low: dev box has 16 GB RAM
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: macro_f1
  greater_is_better: true
  early_stopping_patience: 2

# CPU export (Phase 5.5): what the demo laptop actually loads.
export:
  quantize: dynamic_int8               # torch.quantization.quantize_dynamic
  onnx: true                           # also emit an ONNX Runtime graph (optional)
  artifact_dir: artifacts
  version_tag: v1
