[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "absa"
version = "0.1.0"
description = "Aspect-Based Sentiment Analysis: ATE + ACD + ASC with a classical baseline and a transformer track."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ABSA Team" }]
keywords = ["nlp", "sentiment-analysis", "absa", "semeval", "transformers"]

# Base dependencies: lightweight, no deep-learning stack (installable on the demo laptop).
dependencies = [
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "PyYAML==6.0.2",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
# Shared ML stack (no torch wheel index pinned here — see requirements-*.txt).
ml = [
    "torch==2.5.1",
    "transformers==4.46.3",
    "datasets==3.1.0",
    "evaluate==0.4.3",
    "accelerate==1.1.1",
    "scikit-learn==1.5.2",
    "sklearn-crfsuite==0.5.0",
    "spacy==3.8.2",
    "sentencepiece==0.2.0",
    "seqeval==1.2.2",
    "mlflow==2.18.0",
    "matplotlib==3.9.2",
]
# CPU deployment (demo laptop): ml stack + ONNX Runtime for the exported artifact.
cpu = ["absa[ml]", "onnx==1.17.0", "onnxruntime==1.20.1"]
# GPU training (desktop): same ml stack, CUDA torch wheel comes from requirements-gpu.txt.
gpu = ["absa[ml]"]
serve = ["fastapi==0.115.5", "uvicorn[standard]==0.32.1"]
demo = ["streamlit==1.40.2"]
dev = [
    "ruff==0.8.2",
    "black==24.10.0",
    "mypy==1.13.0",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pre-commit==4.0.1",
    "httpx==0.28.1",
    "types-PyYAML==6.0.12.20240917",
]
all = ["absa[cpu,serve,demo,dev]"]

[project.urls]
Homepage = "https://example.com/absa"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
absa = ["py.typed"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "app"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
warn_return_any = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --cov=absa --cov-report=term-missing --cov-report=xml --cov-fail-under=70"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a CUDA device",
    "requires_torch: marks tests that need the deep-learning stack installed",
]

[tool.coverage.run]
source = ["absa"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
